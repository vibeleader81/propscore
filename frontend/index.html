<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏠</text></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PropScore — Australian Property Intelligence</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Inter:wght@300..700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet" />
    <!-- reCAPTCHA v3 — only loaded when site key is configured -->
    <script>
      (function() {
        var key = '__RECAPTCHA_SITE_KEY__';
        if (key && key !== '__RECAPTCHA_SITE_KEY__') {
          var s = document.createElement('script');
          s.src = 'https://www.google.com/recaptcha/api.js?render=' + key;
          s.async = true; s.defer = true;
          document.head.appendChild(s);
          window.__RECAPTCHA_SITE_KEY__ = key;
        }
      })();
    </script>
  </head>
  <body class="bg-[#f7f5f9]">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
